# Build and push the todomcp container image to GitHub Container Registry
name: Build & push to GHCR

# Run on pushes to the default branch, or on version tags (v1.0.0, etc.)
on:
  push:
    branches: [main]
    tags: ['v*']

# Read the code; write access to push packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - uses: actions/checkout@v4

      # Create the docker buildx CLI plugin (needed for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the job's built-in token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image name and tags to apply to the built image
      - name: Extract metadata (tags + labels)
        uses: docker/metadata-action@v5
        id: meta
        with:
          # Image name in the registry
          images: ghcr.io/${{ github.repository_owner }}/todomcp
          # `latest` on pushes to the main branch; semver tag on v* tags;
          # git sha always (so the image is addressable by exact commit)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Build the image from the repo root and push it to GHCR
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse build layer cache from previous Actions runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Target the server's CPU architecture explicitly
          platforms: linux/amd64
