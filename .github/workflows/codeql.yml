# CodeQL static security analysis for C#
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.100"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: csharp
          build-mode: manual

      # Manual build command runs between init and analyze and is what the
      # CodeQL tooling records for extraction.
      - name: Build
        run: dotnet build TodoMcp.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language=csharp"
