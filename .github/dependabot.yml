# Keep the dependency surface fresh and reviewed
# see docs/public-repos.md
version: 2
updates:
  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions (version-bumped, SHA pinning is the human's job)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # codeql-action/init and analyze must be on the same version, so bump
      # them together in one PR instead of two mismatched ones
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 10

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
